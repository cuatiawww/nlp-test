services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: disease-postgis
    restart: no
    env_file: .env
    ports:
      - "9876:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: disease-minio
    restart: no
    env_file: .env
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: disease-rabbitmq
    restart: no
    env_file: .env
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nlp-python:
    build:
      context: ./services/nlp-python
    container_name: disease-nlp-python
    restart: no
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./services/nlp-python/models:/app/models
    environment:
      - NLP_MODEL=fine-tuned

  backend-rust:
    build:
      context: ./services/backend-rust
    container_name: disease-backend-rust
    restart: no
    env_file: .env
    ports:
      - "8081:8081"
    depends_on:
      nlp-python:
        condition: service_started
      postgres:
        condition: service_healthy

  worker-python:
    build:
      context: ./services/worker-python
    container_name: disease-worker-python
    restart: no
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      nlp-python:
        condition: service_started

  collector-python:
    build:
      context: ./services/collector-python
    container_name: disease-collector-python
    restart: no
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      nlp-python:
        condition: service_started

  frontend-next:
    build:
      context: ./services/frontend-next
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
    container_name: disease-frontend-next
    restart: no
    env_file: .env
    ports:
      - "3010:3000"
    depends_on:
      - backend-rust

  init:
    image: alpine:latest
    container_name: disease-init
    restart: no
    profiles: ["init"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      backend-rust:
        condition: service_started
    volumes:
      - ./database/init:/init
    command: >
      /bin/sh -c "
        apk add --no-cache postgresql-client curl >/dev/null 2>&1 &&
        echo '⏳ Running init...' &&
        until pg_isready -h postgres -U postgres -d disease_ai 2>/dev/null; do sleep 1; done &&
        until curl -sf http://backend-rust:8081/health >/dev/null 2>&1; do sleep 1; done &&
        echo '✅ PostgreSQL + Backend ready' &&
        HASH=\$$(echo -n \"\$${WEBMASTER_PASSWORD:-K3mk3s#2202%ok}\" | sha256sum | cut -d' ' -f1) &&
        PGPASSWORD=\$$POSTGRES_PASSWORD psql -h postgres -U postgres -d disease_ai -c \"
          INSERT INTO users (username, password_hash, display_name, role, email)
          VALUES ('webmaster', '\$$HASH', 'Webmaster', 'admin', 'admin@disease-ai.local')
          ON CONFLICT (username) DO UPDATE SET password_hash = EXCLUDED.password_hash;
        \" 2>&1 &&
        echo '✅ User seeded' &&
        echo 'Init complete'
      "

volumes:
  postgres_data:
  minio_data:
