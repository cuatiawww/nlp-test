services:
  minio:
    image: minio/minio:latest
    container_name: disease-minio
    restart: no
    env_file: .env
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: disease-rabbitmq
    restart: no
    env_file: .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nlp-python:
    build:
      context: ./services/nlp-python
    container_name: disease-nlp-python
    restart: no
    env_file: .env
    ports:
      - "8003:8000"
    volumes:
      - ./services/nlp-python/models:/app/models
    environment:
      - NLP_MODEL=fine-tuned
    networks:
      - default
      - db_db

  backend-rust:
    build:
      context: ./services/backend-rust
    container_name: disease-backend-rust
    restart: no
    env_file: .env
    ports:
      - "8081:8081"
    volumes:
      - ./database/init:/init:ro
    depends_on:
      nlp-python:
        condition: service_started
    networks:
      - default
      - db_db

  worker-python:
    build:
      context: ./services/worker-python
    container_name: disease-worker-python
    restart: no
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      nlp-python:
        condition: service_started
    networks:
      - default
      - db_db

  collector-python:
    build:
      context: ./services/collector-python
    container_name: disease-collector-python
    restart: no
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      nlp-python:
        condition: service_started
    networks:
      - default
      - db_db

  frontend-next:
    build:
      context: ./services/frontend-next
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3010/nlp}
    container_name: disease-frontend-next
    restart: no
    env_file: .env
    ports:
      - "3010:3000"
    depends_on:
      - backend-rust

  init:
    image: alpine:latest
    container_name: disease-init
    restart: no
    profiles: ["init"]
    env_file: .env
    depends_on:
      backend-rust:
        condition: service_started
    volumes:
      - ./database/init:/init
    networks:
      - default
      - db_db
    command: >
      /bin/sh -c "
        apk add --no-cache postgresql-client curl >/dev/null 2>&1 &&
        echo '⏳ Running init...' &&
        echo '📦 Creating database disease_ai if not exists...' &&
        PGPASSWORD=\$$POSTGRES_PASSWORD psql -h db-postgres -U postgres -d postgres -c \"CREATE DATABASE disease_ai\" 2>/dev/null || true &&
        until PGPASSWORD=\$$POSTGRES_PASSWORD pg_isready -h db-postgres -U postgres -d disease_ai 2>/dev/null; do sleep 1; done &&
        echo '✅ PostgreSQL ready on db-postgres' &&
        until curl -sf http://backend-rust:8081/health >/dev/null 2>&1; do sleep 1; done &&
        echo '✅ Backend ready' &&
        HASH=\$$(echo -n \"\$${WEBMASTER_PASSWORD:-K3mk3s#2202%ok}\" | sha256sum | cut -d' ' -f1) &&
        PGPASSWORD=\$$POSTGRES_PASSWORD psql -h db-postgres -U postgres -d disease_ai -c \"
          INSERT INTO users (username, password_hash, display_name, role, email)
          VALUES ('webmaster', '\$$HASH', 'Webmaster', 'admin', 'admin@disease-ai.local')
          ON CONFLICT (username) DO UPDATE SET password_hash = EXCLUDED.password_hash;
        \" 2>&1 &&
        echo '✅ User seeded' &&
        echo 'Init complete'
      "

volumes:
  minio_data:
  rabbitmq_data:

networks:
  default:
  db_db:
    external: true
