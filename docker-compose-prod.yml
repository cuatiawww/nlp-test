services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: disease-rabbitmq
    restart: unless-stopped
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      # AMQP remains internal. Management is local-only by default.
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - default

  minio:
    image: minio/minio:latest
    container_name: disease-minio
    restart: unless-stopped
    env_file: .env
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data

  nlp-python:
    build:
      context: ./services/nlp-python
    container_name: disease-nlp-python
    restart: unless-stopped
    env_file: .env
    environment:
      NLP_MODEL: ${NLP_MODEL:-fine-tuned}
    ports:
      - "127.0.0.1:${NLP_PORT:-8003}:8000"
    volumes:
      - ./services/nlp-python/models:/app/models
    networks:
      - default
      - db_db

  backend-rust:
    build:
      context: ./services/backend-rust
    container_name: disease-backend-rust
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8081"
    volumes:
      - ./database/init:/init:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      nlp-python:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - db_db

  worker-python:
    build:
      context: ./services/worker-python
    container_name: disease-worker-python
    restart: unless-stopped
    env_file: .env
    depends_on:
      nlp-python:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - db_db

  collector-python:
    build:
      context: ./services/collector-python
    container_name: disease-collector-python
    restart: unless-stopped
    env_file: .env
    depends_on:
      nlp-python:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - db_db

  frontend-next:
    build:
      context: ./services/frontend-next
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${FRONTEND_PORT:-3010}/nlp}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/nlp}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend-rust:8081}
    container_name: disease-frontend-next
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend-rust:8081}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3010}:3000"
    depends_on:
      backend-rust:
        condition: service_healthy

  init:
    image: alpine:3.20
    container_name: disease-init
    restart: "no"
    profiles: ["init"]
    env_file: .env
    depends_on:
      backend-rust:
        condition: service_started
    volumes:
      - ./database/init:/init:ro
    networks:
      - default
      - db_db
    command: >-
      /bin/sh -c "
      apk add --no-cache postgresql-client curl >/dev/null 2>&1;
      until PGPASSWORD=\$$POSTGRES_PASSWORD pg_isready -h db-postgres -U postgres -d disease_ai; do sleep 2; done;
      until curl -fsS http://backend-rust:8081/health >/dev/null; do sleep 2; done;
      echo 'Production dependencies are ready.'
      "

volumes:
  minio_data:
  rabbitmq_data:

networks:
  default:
  db_db:
    external: true
