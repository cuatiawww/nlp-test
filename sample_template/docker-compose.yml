services:
  influenza-dashboard:
    image: node:lts-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3510:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
    command: >
      sh -c "
      apk add --no-cache git python3 make g++ 2>/dev/null &&
      npm install --include=dev &&
      NODE_ENV=production npm run build &&
      npm start -- -H 0.0.0.0
      "
