# Gitea Actions — build & deploy otomatis NLP-Penyakit (KEMKES)
# Trigger: push ke main → build image Docker → deploy stack di server (runner host mode)
# Runner: act_runner (gitea-runner) di server nlp-abvc-dev, label: disease-deploy (host)
# Catatan: host mode → tidak pakai actions JS (checkout manual via git + gitea.token)
# .env, docker-compose.yml & model TIDAK di repo — file lokal server, tidak disentuh.
name: build-and-deploy
run-name: "Deploy ${{ gitea.ref_name }} (${{ gitea.sha }})"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, disease-deploy]
    concurrency:
      group: nlp-penyakit-deploy
      # Hanya deploy versi terbaru: push baru membatalkan run yang antri/running
      cancel-in-progress: true
    steps:
      - name: Checkout
        run: |
          cd "$GITHUB_WORKSPACE"
          # Clear the runner workspace, including hidden files from a previous run.
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

          repo_url="https://gitea.mediaciptainformasi.co.id/KEMKES/NLP-PENYAKIT.git"
          repo_branch="${{ gitea.ref_name }}"
          repo_token="${{ gitea.token }}"

          # Gitea is reached through a runner network where the default
          # GnuTLS/HTTP2 negotiation can occasionally terminate early. Keep
          # certificate verification enabled and retry over HTTP/1.1 instead.
          for attempt in 1 2 3 4 5; do
            if git -c http.version=HTTP/1.1 \
              -c http.maxRequests=1 \
              -c http.lowSpeedLimit=0 \
              -c http.lowSpeedTime=600 \
              -c http.extraHeader="Authorization: token ${repo_token}" \
              clone --depth 1 --single-branch --branch "${repo_branch}" \
              "${repo_url}" .; then
              exit 0
            fi
            echo "Checkout Gitea gagal (percobaan ${attempt}/5); retry..."
            find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            sleep $((attempt * 5))
          done

          echo "Checkout Gitea gagal setelah 5 percobaan"
          exit 1

      - name: Sync source ke folder deploy (tanpa config lokal & models)
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'docker-compose.yml' \
            --exclude 'docker-compose-prod.override.yml' \
            --exclude 'services/nlp-python/models' \
            "$GITHUB_WORKSPACE/" /home/nlpdev/docker/nlp-penyakit-git/

      - name: Build image
        run: docker compose -f docker-compose.yml -f docker-compose-prod.override.yml build
        working-directory: /home/nlpdev/docker/nlp-penyakit-git

      - name: Start dependency services
        run: |
          docker compose -f docker-compose.yml -f docker-compose-prod.override.yml stop disease-frontend-next || true
          docker compose -f docker-compose.yml -f docker-compose-prod.override.yml up -d disease-nlp-python disease-rabbitmq
          # APScheduler loads collector_sources only during collector startup.
          # Recreate the collector so schedule/source changes are picked up.
          docker compose -f docker-compose.yml -f docker-compose-prod.override.yml up -d --no-deps --force-recreate disease-collector-python
        working-directory: /home/nlpdev/docker/nlp-penyakit-git

      - name: Healthcheck collector sebelum backend
        run: |
          echo "Menunggu collector sehat (timeout: 120 detik)..."
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.yml -f docker-compose-prod.override.yml exec -T disease-collector-python \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)" >/dev/null 2>&1; then
              echo "✅ Collector sehat (percobaan ke-$i)"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Collector tidak sehat. Menampilkan status dan log:"
          docker compose -f docker-compose.yml -f docker-compose-prod.override.yml ps
          docker compose -f docker-compose.yml -f docker-compose-prod.override.yml logs --tail 100 disease-collector-python
          exit 1
        working-directory: /home/nlpdev/docker/nlp-penyakit-git

      - name: Deploy backend setelah collector sehat
        run: |
          # Migrations run during backend startup. Force recreation is required
          # when a deployment only changes database/init/*.sql and the image
          # digest therefore remains unchanged.
          docker compose -f docker-compose.yml -f docker-compose-prod.override.yml up -d --no-deps --force-recreate disease-backend-rust
        working-directory: /home/nlpdev/docker/nlp-penyakit-git

      - name: Healthcheck backend
        run: |
          echo "Menunggu backend sehat (timeout: 150 detik)..."
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null 2>&1; then
              echo "✅ Backend sehat (percobaan ke-$i)"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Backend tidak sehat setelah 150 detik. Menampilkan status container dan logs:"
          docker compose -f docker-compose.yml -f docker-compose-prod.override.yml ps
          echo "--- LOGS DISEASE-BACKEND-RUST ---"
          docker compose -f docker-compose.yml -f docker-compose-prod.override.yml logs --tail 100 disease-backend-rust
          echo "--- LOGS DISEASE-NLP-PYTHON ---"
          docker compose -f docker-compose.yml -f docker-compose-prod.override.yml logs --tail 50 disease-nlp-python
          exit 1
        working-directory: /home/nlpdev/docker/nlp-penyakit-git

      - name: Verify database migration mount and interoperability catalog
        run: |
          docker compose -f docker-compose.yml -f docker-compose-prod.override.yml exec -T disease-backend-rust \
            test -f /init/062_seed_interoperability_catalog.sql
          response=$(curl -fsS http://127.0.0.1:8081/api/v1/interoperability-integrations)
          echo "$response"
          echo "$response" | grep -q '"success":true'
        working-directory: /home/nlpdev/docker/nlp-penyakit-git

      - name: Start frontend dan service lain setelah backend sehat
        run: docker compose -f docker-compose.yml -f docker-compose-prod.override.yml up -d --remove-orphans
        working-directory: /home/nlpdev/docker/nlp-penyakit-git
