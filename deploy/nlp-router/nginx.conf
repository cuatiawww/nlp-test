events {}

http {
  upstream disease_nlp_pool {
    zone disease_nlp_pool 64k;
    server disease-nlp-python-a:8000 max_fails=2 fail_timeout=10s;
    server disease-nlp-python-b:8000 max_fails=2 fail_timeout=10s;
  }

  server {
    listen 8000;
    location = /health {
      proxy_pass http://disease_nlp_pool;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }
    location / {
      proxy_pass http://disease_nlp_pool;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
    }
  }
}
