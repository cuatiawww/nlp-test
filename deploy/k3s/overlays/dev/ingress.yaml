apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nlp-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: dev.abvc-surveillance.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: disease-backend-rust, port: {number: 8081}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: disease-frontend-next, port: {number: 3000}}
